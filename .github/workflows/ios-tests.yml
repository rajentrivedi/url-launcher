name: iOS Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, sqlite3
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: |
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Run PHP Tests (Pest)
      run: |
        ./vendor/bin/pest

    - name: Validate Swift Syntax (Virtual Compiler Trick)
      run: |
        # Find your Swift file
        SWIFT_FILE=$(find resources/ios -name "*.swift" | head -n 1)
        if [ -z "$SWIFT_FILE" ]; then
          echo "No Swift file found in resources/ios!"
          exit 1
        fi
        
        echo "Performing virtual compilation on $SWIFT_FILE..."
        
        # Create a temporary 'mock' for NativePHP base classes so the compiler is happy
        cat <<EOF > bridge_mocks.swift
        import Foundation
        protocol BridgeFunction {
            func execute(parameters: [String: Any]) throws -> [String: Any]
        }
        struct BridgeResponse {
            static func success(data: [String: Any]) -> [String: Any] { return ["status": "success", "data": data] }
            static func error(message: String) -> [String: Any] { return ["status": "error", "message": message] }
        }
        EOF

        # Compile the mock + actual plugin file against the real iOS SDK
        swiftc -parse -target arm64-apple-ios15.0 -sdk $(xcrun --show-sdk-path --sdk iphoneos) bridge_mocks.swift "$SWIFT_FILE"
