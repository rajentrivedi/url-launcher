name: iOS Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, sqlite3
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: |
        composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Run PHP Tests (Pest)
      run: |
        ./vendor/bin/pest

    - name: Validate Swift Syntax
      run: |
        # Find your Swift file (adjust path if needed)
        SWIFT_FILE=$(find . -name "*.swift" | head -n 1)
        if [ -z "$SWIFT_FILE" ]; then
          echo "No Swift file found!"
          exit 1
        fi
        echo "Checking $SWIFT_FILE..."
        # This command checks syntax without needing a full Xcode project
        swiftc -parse -target arm64-apple-ios15.0 -sdk $(xcrun --show-sdk-path --sdk iphoneos) "$SWIFT_FILE"
